<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="216" viewBox="0 0 1200 216" role="img" aria-label="Projetos — uma amostra do que já construí"><style>@font-face{font-family:D8;font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}.d8{font-family:D8,'Arial Black',Arial,sans-serif;font-weight:800}
@font-face{font-family:B4;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}.b4{font-family:B4,'Helvetica Neue',Arial,sans-serif;font-weight:400}
@font-face{font-family:M5;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}.m5{font-family:M5,ui-monospace,Menlo,Consolas,monospace;font-weight:500}

.in{opacity:0;animation:in .9s cubic-bezier(.22,1,.36,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.beat{animation:beat 2.4s ease-in-out infinite}@keyframes beat{50%{opacity:.25}}
.flow{stroke-dasharray:3 9;animation:flow 1.1s linear infinite}@keyframes flow{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.in{opacity:1}}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(8px)}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#021c19"/><stop offset="1" stop-color="#013f38"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#8cc63f" stop-opacity=".24"/><stop offset="1" stop-color="#8cc63f" stop-opacity="0"/></radialGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#8cc63f" fill-opacity=".11"/></pattern><clipPath id="clip"><rect width="1200" height="216" rx="20"/></clipPath></defs>
<g clip-path="url(#clip)"><rect width="1200" height="216" fill="url(#bg)"/><rect width="1200" height="216" fill="url(#dots)"/><circle cx="1060" cy="240" r="340" fill="url(#glow)"/>
