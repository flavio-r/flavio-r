<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Obrigado pela visita — Flávio R., Joinville, SC"><style>@font-face{font-family:D8;font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}.d8{font-family:D8,'Arial Black',Arial,sans-serif;font-weight:800}
